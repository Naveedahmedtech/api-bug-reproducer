<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Bug Reproducer</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f7fb; color: #172033; }
    body { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
    .card { background: #fff; border: 1px solid #e1e5ef; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px #26345a12; }
    h1 { margin: 0 0 8px; font-size: 30px; } p { color: #536078; }
    textarea { width: 100%; min-height: 130px; box-sizing: border-box; border: 1px solid #cdd4e3; border-radius: 10px; padding: 12px; font: inherit; resize: vertical; }
    button, a { display: inline-block; margin-top: 14px; border: 0; border-radius: 8px; padding: 10px 14px; background: #3758d8; color: #fff; font-weight: 650; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .6; cursor: wait; } #status { margin-top: 18px; font-weight: 650; } pre { white-space: pre-wrap; overflow: auto; background: #101827; color: #e8edf8; padding: 16px; border-radius: 10px; line-height: 1.45; }
    .muted { font-size: 13px; } .pass { color: #117548; } .fail { color: #b33a36; }
  </style>
</head>
<body>
  <main class="card">
    <h1>API Bug Reproducer</h1>
    <p>Paste a report about the synthetic orders API. The local deterministic planner will create a bounded request/assertion plan, run both fixture variants, and show the trace.</p>
    <label for="report"><strong>Bug report</strong></label>
    <textarea id="report">GET /orders with status=shipped, limit=2, offset=0 returns only one item even though total is 4.</textarea>
    <br><button id="run">Build reproduction</button>
    <div id="status" role="status"></div>
    <div id="actions"></div>
    <pre id="output" aria-live="polite">No run yet.</pre>
    <p class="muted">Evidence is deterministic-stub verification; this demo does not claim real model quality.</p>
  </main>
  <script>
    const report = document.querySelector('#report'), run = document.querySelector('#run'), status = document.querySelector('#status'), output = document.querySelector('#output'), actions = document.querySelector('#actions');
    run.addEventListener('click', async () => {
      run.disabled = true; actions.replaceChildren(); status.textContent = 'Running bounded fixture checks…'; status.className = ''; output.textContent = '';
      try {
        const response = await fetch('/api/reproduce', { method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({report: report.value}) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'request failed');
        if (result.kind === 'clarification') { status.textContent = 'More detail needed'; output.textContent = JSON.stringify(result, null, 2); return; }
        status.textContent = result.verification.status === 'verified' ? 'Verified: buggy fails, corrected passes' : 'Not verified';
        status.className = result.verification.status === 'verified' ? 'pass' : 'fail';
        output.textContent = JSON.stringify({plan: result.plan, verification: result.verification, trace: {buggy: result.verification.buggy.trace, corrected: result.verification.corrected.trace}}, null, 2);
        const link = document.createElement('a'); link.textContent = 'Download Node test'; link.download = 'reproduction.test.mjs'; link.href = URL.createObjectURL(new Blob([result.exportedTest], {type: 'text/javascript'})); actions.append(link);
      } catch (error) { status.textContent = error.message; status.className = 'fail'; }
      finally { run.disabled = false; }
    });
  </script>
</body>
</html>
